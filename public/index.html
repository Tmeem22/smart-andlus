<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>ذكاء الأندلس — Smart Andlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css?v=17">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <div class="login-card">
    <div class="login-head">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6.5v5c0 5 3.8 8.9 9 10.5 5.2-1.6 9-5.5 9-10.5v-5L12 2Z" fill="#0d5c46"/><path d="M12 6.5 8 9v4l4 2.2L16 13V9l-4-2.5Z" fill="#c9a227"/></svg>
      </div>
      <h1>ذكاء الأندلس</h1>
      <p>Smart Andlus · منصة التواصل التعليمي الذكية</p>
    </div>
    <div class="login-body">
      <!-- معالج اختيار الدور (متحرك) -->
      <div id="wizard"></div>

      <!-- نموذج تسجيل الدخول (يظهر بعد اختيار الدور) -->
      <div id="loginForm" hidden>
        <div id="parentFields" hidden>
          <div class="field"><label id="idLabel">رقم هوية الطالب</label>
            <input id="lgId" inputmode="numeric" placeholder="أدخل رقم الهوية"></div>
        </div>
        <div id="passFields" hidden>
          <div class="field"><label>اسم المستخدم</label><input id="lgUser" placeholder="أدخل اسم المستخدم"></div>
          <div class="field"><label>كلمة المرور</label><input id="lgPass" type="password" placeholder="••••••••"></div>
        </div>
        <div class="err" id="lgErr"></div>
        <button class="btn block" id="lgBtn">تسجيل الدخول</button>
        <button class="btn ghost block mt" id="lgBack">↻ رجوع</button>
        <div class="demo-hint" id="demoHint"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <div class="topbar">
    <button class="icon-btn" id="menuBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2 3 6.5v5c0 5 3.8 8.9 9 10.5 5.2-1.6 9-5.5 9-10.5v-5L12 2Z" fill="#0d5c46"/><path d="M12 6.5 8 9v4l4 2.2L16 13V9l-4-2.5Z" fill="#c9a227"/></svg></div>
    <div class="title">ذكاء الأندلس<small>SMART ANDLUS</small></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="notifBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge red hidden" id="notifBadge">0</span>
    </button>
    <div id="notifPanel"></div>
    <div class="user-pill">
      <div class="avatar" id="uAvatar">؟</div>
      <div><div class="nm" id="uName">—</div><div class="rl" id="uRole">—</div></div>
    </div>
    <button class="icon-btn" id="logoutBtn" title="خروج">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
    </button>
  </div>

  <div class="layout">
    <aside class="side"><nav id="navMenu"></nav></aside>
    <div class="side-scrim" id="sideScrim"></div>
    <main class="main" id="mainView"></main>
  </div>
</div>

<div id="toasts"></div>
<div id="modalRoot"></div>
<div id="callRoot"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js?v=17"></script>
</body>
</html>
